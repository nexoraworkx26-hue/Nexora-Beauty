<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Nexora Beauty — Salon & Beauty Business Toolkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#08050F;--pn:#171025;--pn2:#1f1633;--pu:#A020F0;--mg:#E100FF;--tx:#FFFFFF;--mu:#B9B2C8;--ln:#2d2145;--ok:#3ddc97;--wr:#ffb454;--er:#ff5d7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;min-height:100vh}
nav{width:218px;background:var(--pn);border-right:1px solid var(--ln);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-weight:700;letter-spacing:.04em}
.brand img{width:34px;height:34px;object-fit:contain}.brand .lg{width:34px;height:34px;border:1px dashed var(--pu);border-radius:10px;display:grid;place-items:center;color:var(--mg);font-size:11px}
nav a{display:block;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--pn2);color:var(--tx)}nav a.on{background:linear-gradient(90deg,rgba(160,32,240,.28),rgba(225,0,255,.08));color:var(--tx);box-shadow:inset 2px 0 var(--mg)}
main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1280px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mu);margin-bottom:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:16px;min-width:0}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.v{font-size:24px;font-weight:700;margin-top:4px}
.btn{background:linear-gradient(135deg,var(--pu),var(--mg));color:#fff;border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--pn2);border:1px solid var(--ln);color:var(--tx)}.btn.d{background:transparent;border:1px solid var(--er);color:var(--er)}.btn.t{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{width:100%;background:#0f0a1a;border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:8px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--pu)}label{display:block;color:var(--mu);font-size:12px;margin:0 0 4px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.f>div.w{grid-column:1/-1}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:500;text-align:left;font-size:12px}
th,td{padding:8px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}td.r,th.r{text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pn2);border:1px solid var(--ln)}
.tag.accepted,.tag.completed,.tag.active{color:var(--ok)}.tag.declined,.tag.overdue{color:var(--er)}.tag.sent,.tag.in-progress{color:var(--wr)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input,.bar select{width:auto;min-width:150px}
.demo{background:rgba(160,32,240,.12);border:1px solid var(--pu);border-radius:12px;padding:8px 12px;color:var(--mu);margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{font-size:12px;color:var(--mu)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wr);margin-right:6px}.dot.on{background:var(--ok)}
.res{font-size:30px;font-weight:800;background:linear-gradient(90deg,var(--pu),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ln)}
#mod{position:fixed;inset:0;background:rgba(8,5,15,.8);display:none;place-items:center;z-index:50;padding:16px}
#mod .card{width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--pn)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:var(--pn2);border-radius:8px;min-height:74px;padding:4px;font-size:11px;overflow:hidden}.cal .h{min-height:0;background:none;color:var(--mu);text-align:center}
.cal .j{background:var(--pu);border-radius:5px;padding:1px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0}.chk input{width:auto}
#tb{display:none}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:2px}nav .brand{display:none}nav a{white-space:nowrap;margin:0}main{padding:16px 14px 50px}#tb{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pn);font-weight:700}}

button.nv{display:block;width:100%;text-align:left;background:none;border:0;font:inherit;padding:9px 12px;border-radius:10px;color:var(--mu);cursor:pointer;margin-bottom:2px}button.nv:hover{background:var(--pn2);color:var(--tx)}button.nv.on{background:linear-gradient(90deg,rgba(160,32,240,.28),rgba(225,0,255,.08));color:var(--tx);box-shadow:inset 2px 0 var(--mg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mg);outline-offset:2px}
.err{color:var(--er);margin-top:8px;min-height:18px}.wk{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;overflow-x:auto}.wk>div{background:var(--pn2);border-radius:10px;padding:6px;min-height:120px}
.ap{background:var(--pu);border-radius:6px;padding:2px 6px;margin-top:3px;cursor:pointer;font-size:12px}.ap.completed{background:#1f6b4d}.ap.cancelled{background:#444;text-decoration:line-through}
@media(max-width:760px){button.nv{white-space:nowrap;width:auto}}</style></head><body>

let cr=[{p:'',q:0}];
function calc(){const b=B(),c=S.calc||{};return head('Treatment Pricing Calculator','Cost-plus pricing with a clear breakdown.')+`<div class="grid g2"><div class="card"><h2>Inputs</h2><div class="f"><div><label for="k_n">Treatment name</label><input id="k_n" value="${esc(c.n||'')}" oninput="calcUpd()"></div><div><label for="k_d">Duration (min)</label><input id="k_d" type="number" min="5" value="${c.d||60}" oninput="calcUpd()"></div><div><label for="k_l">Labour cost / hour (${cur()})</label><input id="k_l" type="number" value="${c.l??b.labour}" oninput="calcUpd()"></div><div><label for="k_o">Monthly overheads (${cur()})</label><input id="k_o" type="number" value="${c.o??b.oh}" oninput="calcUpd()"></div><div><label for="k_h">Billable hours / month</label><input id="k_h" type="number" value="${c.h??b.hrs}" oninput="calcUpd()"></div><div><label for="k_m">Desired margin %</label><input id="k_m" type="number" value="${c.m??b.margin}" oninput="calcUpd()"></div></div><h2 style="margin-top:14px">Products used</h2><div id="k_r"></div><button class="btn s t" onclick="crRead();cr.push({p:'',q:0});crDraw()">+ Add product</button></div><div class="card"><h2>Result</h2><div id="k_out"></div><div class="bar" style="margin-top:12px"><button class="btn" onclick="calcSave()">Save as service</button></div></div></div>`}
function crDraw(){const e=$('#k_r');if(!e)return;e.innerHTML=S.stock.length?cr.map((r,k)=>`<div class="f" style="grid-template-columns:3fr 1fr auto;margin-bottom:6px"><select id="r_p${k}" aria-label="Product" onchange="calcUpd()"><option value="">Choose product</option>${S.stock.map(p=>`<option value="${p.id}" ${r.p===p.id?'selected':''}>${esc(p.name)} (${M(p.price/p.qty)}/${p.unit})</option>`).join('')}</select><input id="r_q${k}" type="number" aria-label="Quantity used" value="${r.q}" oninput="calcUpd()"><button class="btn d t" onclick="crRead();cr.splice(${k},1);crDraw();calcUpd()">✕</button></div>`).join(''):'<span class="badge">Add products under Stock to include product costs.</span>'}
function crRead(){cr.forEach((r,k)=>{const p=$('#r_p'+k);if(p){r.p=p.value;r.q=parseFloat($('#r_q'+k).value)||0}})}
function calcGet(){const g=i=>parseFloat($('#k_'+i).value)||0;crRead();const d=g('d'),prod=sum(cr.map(r=>{const p=by(S.stock,r.p);return p.id?p.price/p.qty*r.q:0})),lab=g('l')*d/60,oh=g('h')>0?g('o')/g('h')*d/60:0,cost=prod+lab+oh,m=g('m'),price=m<100?cost/(1-m/100):NaN;return{d,prod,lab,oh,cost,m,price,profit:price-cost}}
function calcUpd(){if(!$('#k_n'))return;if($('#k_r')&&!$('#k_r').innerHTML)crDraw();const r=calcGet(),ok=isFinite(r.price)&&r.cost>0;S.calc={n:$('#k_n').value,d:r.d,l:$('#k_l').value,o:$('#k_o').value,h:$('#k_h').value,m:$('#k_m').value};try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
$('#k_out').innerHTML=`<div class="k">Suggested price</div><div class="res">${isFinite(r.price)?M(r.price):'Margin must be below 100%'}</div>`+[['Products',M(r.prod)],['Labour ('+r.d+' min)',M(r.lab)],['Overhead allocation',M(r.oh)],['<b>Total cost</b>','<b>'+M(r.cost)+'</b>'],['Profit per treatment',isFinite(r.price)?M(r.profit):'—'],['Margin (profit ÷ price)',ok?(r.profit/r.price*100).toFixed(1)+'%':'—'],['Markup (profit ÷ cost)',ok?(r.profit/r.cost*100).toFixed(1)+'%':'—'],['Price incl. '+B().vat+'% VAT',isFinite(r.price)?M(r.price*(1+B().vat/100)):'—']].map(x=>`<div class="row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
function calcSave(){const r=calcGet();if(!isFinite(r.price)||r.cost<=0)return alert('Enter costs and a valid margin first.');if(!S.cats.length)return;svcForm(null,{name:$('#k_n').value,dur:r.d,price:+r.price.toFixed(2),use:cr.filter(x=>x.p&&x.q>0).map(x=>({...x}))})}

function setup(){const b=B(),i=(k,l,t='text')=>`<div><label for="s_${k}">${l}</label><input id="s_${k}" ${cloud.admin?'':'disabled'} type="${t}" value="${esc(b[k])}" onchange="bSet('${k}',this.value)"></div>`;return head('Salon Setup','Details used on PDFs and calculator defaults.')+`<div class="card"><h2>Business</h2><div class="f">${i('name','Salon name')}${i('phone','Phone')}${i('email','Email')}${i('addr','Address')}${i('cur','Currency symbol (ZAR = R)')}${i('vat','VAT %','number')}${i('labour','Default labour cost / hour','number')}${i('oh','Monthly overheads','number')}${i('hrs','Billable hours / month','number')}${i('margin','Default margin %','number')}${logoBox()}</div></div><div class="card" style="margin-top:14px"><h2>Operating hours</h2><div class="f">${[1,2,3,4,5,6,0].map(d=>{const h=b.hours[d];return`<div><label>${DN[d]}</label><div class="bar" style="margin:0"><input type="time" style="min-width:0" aria-label="${DN[d]} open" value="${h?h[0]:''}" onchange="hSet(${d})" id="ho${d}" ${h?'':'disabled'}><input type="time" style="min-width:0" aria-label="${DN[d]} close" value="${h?h[1]:''}" onchange="hSet(${d})" id="hc${d}" ${h?'':'disabled'}><label class="chk"><input type="checkbox" ${h?'':'checked'} onchange="hClose(${d},this.checked)"> Closed</label></div></div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><h2>Categories</h2>${S.cats.map(c=>`<span class="tag">${esc(c)}</span> `).join('')} <button class="btn s t" onclick="catForm()">Add</button></div>`}
function bSet(k,v){if(!can()){draw();return}B()[k]=['vat','labour','oh','hrs','margin'].includes(k)?parseFloat(v)||0:v;save()}
function hSet(d){if(!can()){draw();return}const o=$('#ho'+d).value,c=$('#hc'+d).value;if(tm(c)<=tm(o)){alert('Closing must be after opening.');draw();return}B().hours[d]=[o,c];save()}
function hClose(d,x){if(!can()){draw();return}B().hours[d]=x?null:['09:00','17:00'];save();draw()}
const LOGO=()=>S.logo&&S.logo.d||'';
function pdfLogo(d){const L=S.logo;if(!L||!L.d)return 12;const k=Math.min(40/L.w,22/L.h),w=L.w*k,h=L.h*k,y=4+(24-h)/2;try{d.setFillColor(255,255,255);d.roundedRect(11,y-1,w+2,h+2,1.5,1.5,'F');d.addImage(L.d,L.d.startsWith('data:image/png')?'PNG':'JPEG',12,y,w,h)}catch(e){}return 12+w+6}
function logoBox(){const L=LOGO();return`<div class="w"><label for="lg">Your logo (PNG or JPG) – shown in the app and on all PDFs, and shared with your team</label>${L?`<div class="bar"><span style="background:#fff;border-radius:8px;padding:6px;display:inline-block"><img src="${L}" alt="Your logo" style="max-height:60px;max-width:180px;display:block"></span><button class="btn d t" onclick="logoDel()">Remove logo</button></div>`:'<p class="badge">No logo uploaded yet – PDFs will show your business name only.</p>'}<input id="lg" type="file" accept="image/png,image/jpeg" onchange="logoSet(this)"></div>`}
function logoDel(){if(!can())return;S.logo=null;save();nav();draw()}
function logoSet(el){if(!can()){el.value='';return}const f=el.files[0];if(!f)return;if(!/^image\/(png|jpeg)$/.test(f.type))return alert('Please choose a PNG or JPG image.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);let d=c.toDataURL('image/png');if(d.length>120000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);d=c.toDataURL('image/jpeg',.85)}S.logo={d,w,h};save();nav();draw()};im.onerror=()=>alert('That image could not be read.');im.src=r.result};r.readAsDataURL(f)}
function set(){return head('Workspace & Data','Sync, access and exports.')+`<div class="grid g2"><div class="card"><h2>Shared workspace</h2><div class="row"><span>Shared database</span><b>${cloud.on?'Connected':'Not available here'}</b></div><div class="row"><span>Your access</span><b>${cloud.on?(cloud.admin?'Administrator':'Staff (cannot delete or edit setup)'):'Single device'}</b></div><p>${cloud.on?'Everyone you share this page with in claude.ai sees the same salon records and changes sync between devices.':'Records are saved only in this browser. Open the published page while signed in to claude.ai for shared storage.'}</p><p class="badge">Sign-in is provided by claude.ai; this page has no logins of its own. In-page restrictions hide actions but are not a security boundary. For per-user permissions, audit logs or reminder emails/SMS, a custom backend is required.</p><span id="who" class="badge"></span></div><div class="card"><h2>Export &amp; import</h2><div class="bar"><button class="btn" onclick="dl('nexora-beauty-backup.json',JSON.stringify(S),'application/json')">Full backup (JSON)</button><button class="btn s" onclick="finCsv()">Finance CSV</button><button class="btn s" onclick="dl('customers.csv',csv([['Name','Phone','Email','Preferences','Follow-up'],...S.cust.map(c=>[c.name,c.phone,c.email,c.pref,c.follow])]),'text/csv')">Customers CSV</button><button class="btn s" onclick="dl('appointments.csv',csv([['Date','Start','Customer','Service','Staff','Status','Notes'],...S.appts.map(a=>[a.date,a.start,cn(a.cust),sn(a.svc),tn(a.staff),a.status,a.notes])]),'text/csv')">Appointments CSV</button></div><div class="bar"><input type="file" accept=".json" aria-label="Import backup" onchange="imp(this)"><button class="btn d" onclick="reset()">Erase all data</button></div></div></div>`}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.cust||!o.appts)throw 0;S=o;save();draw()}catch(e){alert('Not a valid Nexora Beauty backup.')}})}
function reset(){if(can()&&confirm('Erase ALL records and restart setup? This cannot be undone.')){S=blank();save();nav();draw()}}
function clearDemo(){if(!can())return;if(confirm('Remove all demonstration records?')){const f=a=>a.filter(x=>!x.demo);['staff','stock','svc','cust','appts','sales','exp'].forEach(k=>S[k]=f(S[k]));S.demo=false;save();draw()}}
nav();draw();
(async()=>{if(!window.claude)return;try{const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(user){cloud.admin=user.canEdit()||user.isOwner();try{const me=await user.me();setTimeout(()=>{const w=$('#who');if(w&&me&&me.name)w.textContent='Signed in as '+me.name},0)}catch(e){}}
if(!db)return;cloud.ref=db.doc('nexora-beauty/state');cloud.on=true;let first=true;cloud.ref.onSnapshot(s=>{if(s.exists){const d=s.data();if(d.rev&&d.rev!==S.rev){try{S=JSON.parse(d.json);localStorage.setItem(LS,d.json);nav();if($('#mod').style.display!=='grid')draw()}catch(e){}}}else if(first&&cloud.admin&&S.done){push()}first=false;badge()},e=>{cloud.err=e.code||'error';badge()})}catch(e){}})();
</script></body></html>
